name: 功能请求
description: 提议一个新能力或改进（提示词、配置、工具、公告、客户端面板、安装脚本）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 [CHANGELOG](../CHANGELOG.md) 和已有 issue，避免重复。
        如果只是想改提示词文案，通常不用改代码——用配置里的 `extraPrompt` 就能做到。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在卡在哪？描述使用场景，而不是直接给方案。
      placeholder: 我只想用精简规则，但又想保留编码代理那几条验证要求……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望插件怎么做？如果涉及配置键，写出你设想的键名与默认值。
      render: yaml
      placeholder: |
        config:
          preset: dev
          concise: true      # 设想：dev 的规则压到四条
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你试过哪些绕法？为什么不行？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 提示词段（位置、文案、preset）
        - 配置项与默认值
        - 工具（sunder_status / sunder_notice / sunder_update / …）
        - 公告中心
        - 更新检查
        - 客户端设置面板（v1.1.0）
        - 安装 / 卸载脚本
        - 文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR 实现这个功能
          required: false
        - label: 我愿意帮忙测试（beta 分支 / 本地 tarball）
          required: false
