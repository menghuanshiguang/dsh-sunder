name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (no harness required)
        run: node test/unit.mjs
      - name: Prompt tests
        run: node test/prompt.mjs
      - name: Integration smoke (skips when no DSH runtime is installed)
        run: node test/smoke.mjs
      - name: Package checks
        run: node scripts/check-package.mjs
