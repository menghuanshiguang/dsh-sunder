name: web-preview

# 手工触发：在 runner 上装一个真实的 DSH Web profile，挂上本仓库的插件，
# 启动 `dsh web`，用 Chromium 截一张设置页的图当 artifact。
#
# 只读：不写仓库、不建 release，唯一的产物是 artifact。

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '安装的 @deepseek-ai/dsh 版本'
        required: false
        default: '0.2.1-rc.2'
        type: string
      wait_ms:
        description: '页面加载后等待多久再截图（毫秒）'
        required: false
        default: '15000'
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home" >> "$GITHUB_ENV"
          echo "PORT=8080" >> "$GITHUB_ENV"


      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 dsh 与 playwright
        run: |
          set -euo pipefail
          npm install -g "@deepseek-ai/dsh@${{ inputs.dsh_version }}"
          dsh --version
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: 初始化 web profile
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME"
          # 首次启动会把 profile 从模板铺到 $DSH_HOME/profiles/web。
          timeout 90 dsh web --port "$PORT" > "$RUNNER_TEMP/init.log" 2>&1 || true
          tail -40 "$RUNNER_TEMP/init.log" || true
          ls -la "$DSH_HOME/profiles" || true

      - name: 挂载插件
        run: |
          set -euo pipefail
          node scripts/install.mjs -p "$DSH_HOME/profiles/web"
          node scripts/doctor.mjs --profile "$DSH_HOME/profiles/web" --no-network --json | head -60

      - name: 启动并截图
        run: |
          set -euo pipefail
          dsh web --port "$PORT" --no-open > "$RUNNER_TEMP/web.log" 2>&1 &
          echo "pid=$!"

          # 服务需要 URL 里的一次性 token；从启动日志里取，别硬拼。
          url=""
          for i in $(seq 1 90); do
            url=$(grep -oE 'http://127\.0\.0\.1:[0-9]+/\?token=[A-Za-z0-9_-]+' "$RUNNER_TEMP/web.log" | head -1 || true)
            if [ -n "$url" ]; then echo "url ready after ${i}s"; break; fi
            sleep 1
          done
          if [ -z "$url" ]; then
            echo "::error title=no-url::dsh web 没有在 90 秒内打印带 token 的 URL"
            tail -60 "$RUNNER_TEMP/web.log"
            exit 1
          fi

          # 插件没激活时也要让这一轮红掉，不要截图假装健康。
          if grep -q 'did not activate' "$RUNNER_TEMP/web.log"; then
            echo "::error title=plugin-not-active::有插件启动失败"
            tail -40 "$RUNNER_TEMP/web.log"
            exit 1
          fi

          # playwright 装在 $RUNNER_TEMP/pw；ESM 按脚本位置解析，所以脚本要放进去。
          cp scripts/preview.mjs "$RUNNER_TEMP/pw/preview.mjs"
          cd "$RUNNER_TEMP/pw"
          node preview.mjs "$url" "$RUNNER_TEMP/shots" --wait "${{ inputs.wait_ms }}" 2>&1 | tee "$RUNNER_TEMP/preview.log"

      - name: 收集日志
        if: always()
        run: |
          cp "$RUNNER_TEMP/web.log" "$GITHUB_WORKSPACE/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/shots" "$RUNNER_TEMP/preview.log" "$GITHUB_WORKSPACE/" 2>/dev/null || true
          tail -80 "$RUNNER_TEMP/web.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-preview
          path: |
            shots/
            web.log
            preview.log
          if-no-files-found: warn
