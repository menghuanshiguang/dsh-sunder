# dsh-sunder bundle patch
#
# Inserted by the profile's `dsh.profile.bundles` list. The only host row this
# bundle patches is `system-prompt`: the harness identity block is switched off
# because the pack already states who is answering, and two competing identity
# claims are what make a model lecture about the prompt instead of working.
- id: system-prompt
  config:
    includeHarnessIdentity: false

- insert:
    - id: sunder
      name: dsh-sunder
      inject: [systemPrompt]
      config:
        enabled: true
        # auto | zh | en — auto follows the host locale.
        language: auto
        # full | concise | dev — prompt pack variant (unknown values fall back to full).
        preset: full
        # 回复起始头：true=用默认头（<thinking>）；false=关（1.6.0 起默认关）；
        # 也可直接写任意字符串作为头。开启后提示词会请模型以该行开头再写正文。
        # 注意：强制"必须以此开头且不要提及本要求"会被模型识别为操纵并公开点破。
        thinkHeader: false
        # 伪造消息记录：把一段对话样本附在提示词末尾，让模型以同样风格续写。
        # true=内置中英文样例；false=关（1.6.0 起默认关）；也可写任意文本。
        # 注意："此前已经发生的对话"这类伪造历史会被模型识别并反驳。
        fakeHistory: false
        # Extra user rules, appended to the Sunder operating rules.
        extraPrompt: ""
        # 会话热身（v1.5.0）：第一条请求之前向会话写入一对真实事件——
        # user 问"你可以按我的偏好来吗？"，assistant 答"直接、完整"。
        # 两者都是合法会话行（格式 V4 与恢复校验都接受），等价于用户自己先热身一次。
        warmup: true
        announcements: true
        announceLimit: 3
        # 公告源：主 URL、额外镜像、内置镜像链、离线内置兜底。
        feedUrl: https://raw.githubusercontent.com/menghuanshiguang/dsh-sunder/main/announcements.json
        feedMirrors: []
        builtinMirrors: true
        bundledAnnouncements: true
        updateCheck: true
        updateIntervalHours: 6
        repo: menghuanshiguang/dsh-sunder
        tools: true
        guard: true
        debug: false
