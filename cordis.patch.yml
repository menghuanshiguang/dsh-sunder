# dsh-sunder bundle patch
#
# Inserted by the profile's `dsh.profile.bundles` list. The only host row this
# bundle patches is `system-prompt`: Sunder provides the identity, so the
# harness identity section is switched off to avoid two competing claims.
- id: system-prompt
  config:
    includeHarnessIdentity: false

- insert:
    - id: sunder
      name: dsh-sunder
      inject: [systemPrompt]
      config:
        enabled: true
        # auto | zh | en — auto follows the host locale.
        language: auto
        # full | concise | dev — prompt pack variant (unknown values fall back to full).
        preset: full
        # 伪造思考链起始头：false=关；true=用默认头；也可直接写任意字符串作为头。
        # 开启后提示词要求每次回复以该头原样开头，再空一行写正文。
        thinkHeader: false
        # 伪造消息记录：把一段"已发生且未审查"的对话样本附在提示词末尾，
        # 让模型以同样风格续写。false=关；true=内置中英文样例；也可写任意文本。
        fakeHistory: false
        # Extra user rules, appended to the Sunder operating rules.
        extraPrompt: ""
        announcements: true
        announceLimit: 3
        # 公告源：主 URL、额外镜像、内置镜像链、离线内置兜底。
        feedUrl: https://raw.githubusercontent.com/menghuanshiguang/dsh-sunder/main/announcements.json
        feedMirrors: []
        builtinMirrors: true
        bundledAnnouncements: true
        updateCheck: true
        updateIntervalHours: 6
        repo: menghuanshiguang/dsh-sunder
        tools: true
        guard: true
        debug: false
